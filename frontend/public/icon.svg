<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Gloss Highlight Gradient -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Letter R Gradient -->
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Soft Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="6" />

  <!-- Top Gloss Highlight -->
  <path d="M 8 128 C 8 60, 60 8, 128 8 L 384 8 C 452 8, 504 60, 504 128 C 504 220, 8 220, 8 128 Z" fill="url(#glossGrad)" />

  <!-- Bold Geometric Modern Capital "R" -->
  <g filter="url(#shadowFilter)">
    <!-- Vertical stem -->
    <path d="M 148 108 L 224 108 L 224 404 L 148 404 Z" fill="url(#rGrad)" />
    
    <!-- Top curved loop of R -->
    <path d="M 216 108 L 316 108 C 378 108, 412 144, 412 206 C 412 268, 378 304, 316 304 L 216 304 Z M 224 174 L 224 238 L 308 238 C 336 238, 348 226, 348 206 C 348 186, 336 174, 308 174 Z" fill="url(#rGrad)" />
    
    <!-- Dynamic right diagonal leg of R with modern angle -->
    <path d="M 284 278 L 380 404 L 452 404 L 344 266 C 324 276, 304 282, 284 284 Z" fill="url(#rGrad)" />

    <!-- Accent dot / Sparkle in Top Right -->
    <circle cx="396" cy="116" r="20" fill="#38bdf8" />
  </g>
</svg>
